[package]
name = "quark-webview"
description = "Native webviews for Quark apps: modal sign-in windows with origin-bound script evaluation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/quark-webview"
keywords = ["gui", "webview", "desktop"]
categories = ["gui"]

[dependencies]
raw-window-handle.workspace = true
serde.workspace = true
serde_json = "1.0"
thiserror.workspace = true
url = "2.5"

# WebView2 built directly on its COM API: asynchronous environment and
# controller creation on the winit message pump, with no nested pumping.
# Versions match wry 0.57's.
[target.'cfg(windows)'.dependencies]
webview2-com = { version = "0.39", optional = true }
windows = { version = "0.62", optional = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
proptest.workspace = true

[features]
# The platform engines: WebKitGTK on Linux, WKWebView on macOS, WebView2 on
# Windows. Without it every open fails with `OpenError::Unsupported`, and the
# policy and session logic builds with no system libraries.
native = ["dep:webview2-com", "dep:windows"]
