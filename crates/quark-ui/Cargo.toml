[package]
name = "quark-ui"
description = "Element tree, layout, styling, theming, and text input for Quark."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
quark.workspace = true
quark-render.workspace = true
quark-text.workspace = true
accesskit.workspace = true
glyphon.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
taffy.workspace = true
unicode-segmentation.workspace = true
quark-syntax = { workspace = true, optional = true }
profiling = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
default = []
# Syntax highlighting of transcript code blocks with the built-in grammars
# (Rust, JS, TS, Python, Bash, JSON, Go). Off by default: the grammars add
# several MB to the binary. Without it code blocks render plain.
syntax = ["dep:quark-syntax", "quark-syntax/common"]
# The inspector overlay, the HUD view, and live style overrides
# (`quark_ui::inspector`). Every hook into the element tree compiles out
# without it.
devtools = []
# Debug builds run full O(n) integrity checks of the row table and the
# transcript (and quark's BlockOrder and AnimationTable) after every
# mutation. Quadratic on large transcripts; CI's test job turns it on.
integrity-checks = ["quark/integrity-checks"]
# Profiler scopes and tracing spans around layout and paint. quark-app's
# profile-puffin and profile-tracy features pick the backend.
profile = ["dep:profiling", "dep:tracing"]

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

