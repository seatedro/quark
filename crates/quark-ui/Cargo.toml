[package]
name = "quark-ui"
description = "Element tree, layout, styling, theming, and text input for Quark."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/quark-ui"
keywords = ["gui", "ui", "layout", "accessibility", "widgets"]
categories = ["gui", "accessibility"]

[dependencies]
quark.workspace = true
quark-render.workspace = true
quark-text.workspace = true
quark-i18n.workspace = true
accesskit.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde_json = "1.0"
taffy.workspace = true
unicode-segmentation.workspace = true
unicode-width = "0.2"
spellbook = "0.4"
quark-syntax = { workspace = true, optional = true }
# GIF and WebP decoders for animated images (APNG comes with PNG).
image = { workspace = true, optional = true, features = ["gif", "webp"] }
profiling = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
default = []
# Syntax highlighting of document code blocks with grammars from the app's
# `quark_syntax::GrammarStore` (local pack directories; no grammar is
# compiled in). Without it code blocks render plain.
syntax = ["dep:quark-syntax", "quark-syntax/engine"]
# `syntax`, plus downloading missing grammar packs from a signed index.
syntax-download = ["syntax", "quark-syntax/download"]
# PNG and JPEG decoding of markdown image blocks on the image worker, and
# GIF, WebP, and APNG decoding for `AnimatedImage::decode`. Without it,
# loaders must hand over decoded pixels, and encoded images show their alt
# text.
images = ["dep:image"]
# The inspector overlay, the HUD view, and live style overrides
# (`quark_ui::inspector`). Every hook into the element tree compiles out
# without it.
devtools = []
# Debug builds run full O(n) integrity checks of the row table and the
# document (and quark's BlockOrder and AnimationTable) after every
# mutation. Quadratic on large documents; CI's test job turns it on.
integrity-checks = ["quark/integrity-checks"]
# `quark_ui::test_alloc`: a counting global allocator type for other crates'
# frame-budget tests. Tests only; it adds nothing to normal builds.
test-alloc = []
# Profiler scopes and tracing spans around layout and paint. quark-app's
# profile-puffin and profile-tracy features pick the backend.
profile = ["dep:profiling", "dep:tracing"]

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
# Animated image tests build GIFs and run the decoder without the `images`
# feature.
image = { workspace = true, features = ["gif", "webp"] }
# Pixel probes of rendered rows, on hosts with a GPU.
quark-render = { workspace = true, features = ["headless-render"] }


# Tests feed published trees through AccessKit's AT-SPI layer to check what
# Linux screen readers receive. Already in every Linux build through
# accesskit_winit, so it adds nothing to the dependency tree.
[target.'cfg(target_os = "linux")'.dev-dependencies]
accesskit_atspi_common = "0.19"

[lints.rust]
# `cfg(kani)` gates the bounded model checking harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
