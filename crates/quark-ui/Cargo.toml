[package]
name = "quark-ui"
description = "Element tree, layout, styling, theming, and text input for Quark."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
quark.workspace = true
quark-render.workspace = true
quark-text.workspace = true
accesskit.workspace = true
glyphon.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
taffy.workspace = true
unicode-segmentation.workspace = true
profiling = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
# The inspector overlay, the HUD view, and live style overrides
# (`quark_ui::inspector`). Every hook into the element tree compiles out
# without it.
devtools = []
# Profiler scopes and tracing spans around layout and paint. quark-app's
# profile-puffin and profile-tracy features pick the backend.
profile = ["dep:profiling", "dep:tracing"]

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[lints.rust]
# `cfg(kani)` gates the bounded model checking harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
