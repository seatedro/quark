[package]
name = "quark-diff"
description = "Diff model for Quark: unified patch parsing, line and word diffs, and display projections."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/quark-diff"
keywords = ["diff", "patch", "unified-diff", "myers"]
categories = ["text-processing", "development-tools"]

# No UI, text shaping, or syntax dependencies: the diff view in
# quark-components adapts this model into elements.
[dependencies]
unicode-segmentation.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints.rust]
# `cfg(kani)` gates the bounded model checking harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
