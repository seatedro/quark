[package]
name = "quark-macros"
description = "The view! and Store macros for Quark."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[dev-dependencies]
# Dev-only cycle (quark depends on this crate) is allowed by cargo and gives
# `{@sig}` integration coverage against the real `SignalStore`.
quark = { path = "../quark" }
trybuild = "1"
