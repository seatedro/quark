[package]
name = "quark"
description = "Declarative UI toolkit core: reactive signals, geometry, hit-testing, scene primitives, semantics."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
quark-macros.workspace = true
serde.workspace = true
taffy.workspace = true

[features]
# Debug builds run the full O(n) integrity check of BlockOrder and
# AnimationTable after every mutation instead of checking only the entries a
# mutation touched. Quadratic on large documents; CI's test job turns it on.
integrity-checks = []

[dev-dependencies]
proptest.workspace = true

[lints.rust]
# `cfg(kani)` gates the bounded model checking harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
