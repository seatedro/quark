[package]
name = "quark-render"
description = "wgpu renderer, text shaping, and font loading for Quark scenes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/quark-render"
keywords = ["gui", "wgpu", "renderer", "graphics"]
categories = ["gui", "rendering"]

[dependencies]
quark.workspace = true
quark-text.workspace = true
bytemuck.workspace = true
etagere.workspace = true
image = { workspace = true, optional = true }
# Path stroking and flattening. Already in every build through resvg's usvg,
# so it adds no crates.
kurbo = "0.11"
lru.workspace = true
pollster.workspace = true
resvg.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu.workspace = true
winit.workspace = true

# GL is the Linux fallback when no Vulkan driver is installed (older GPUs,
# some VMs). Windows always has DX12 or WARP, macOS always has Metal.
[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, features = ["gles"] }

# DirectWrite glyph rasterization (text_engine::raster::directwrite), behind
# text-raster-directwrite. Both crates are already in every Windows build
# through wgpu's DX12 backend and quark-app.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = ["Win32_Foundation", "Win32_Graphics_DirectWrite"] }
windows-core = { version = "0.62", optional = true }

[dev-dependencies]
image.workspace = true
# The color glyph pixel probe draws an emoji.
quark-text = { workspace = true, features = ["emoji-font"] }
# The counting allocator for text preparation budgets. quark-ui depends on
# this crate; Cargo allows the cycle for dev-dependencies.
quark-ui = { workspace = true, features = ["test-alloc"] }

[features]
# Enables the no-surface offscreen render path used by fixture renders, and
# PNG output for it.
headless-render = ["dep:image"]
# The experimental DirectWrite rasterizer on Windows; swash stays the
# default and the fallback.
text-raster-directwrite = ["dep:windows", "dep:windows-core"]
