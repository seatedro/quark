[package]
name = "quark-terminal"
description = "Terminal element for Quark: libghostty-vt terminal state, a PTY, and a virtualized cell grid view."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
links = "ghostty-vt"

[dependencies]
accesskit.workspace = true
quark.workspace = true
quark-render.workspace = true
quark-text.workspace = true
quark-ui.workspace = true
# Key, modifier, and mouse button types: what quark-app's input events
# carry, so apps pass them through unchanged.
winit.workspace = true
# Unix PTYs and Windows ConPTY behind one interface.
portable-pty = "0.9"
# Rasterizes the procedurally drawn cells (box drawing, blocks, powerline)
# the way Ghostty's sprite face does with z2d. Already in every build
# through resvg, with these features.
tiny-skia = "0.11"

[target.'cfg(unix)'.dependencies]
# Polling the PTY so closing it stops blocked reads and writes, and killing
# a program that ignores SIGHUP without racing its reaping.
libc = "0.2"

[features]
default = ["zig-build"]
# Build libghostty-vt from the pinned Ghostty source with Zig 0.16 (see
# build.rs). Off, the build links a prebuilt libghostty-vt.a from
# QUARK_GHOSTTY_VT_LIB_DIR instead.
zig-build = []

[dev-dependencies]
proptest.workspace = true
# The terminal_demo example's window and its headless test harness. The demo
# lives here so quark-app's other examples build without Zig.
quark-app = { workspace = true, features = ["ui", "headless-render"] }
quark-ui = { workspace = true, features = ["test-alloc"] }

[[example]]
name = "terminal_demo"
# Its test module drives the terminal through `quark_app::testing`, with a
# real shell on Linux and macOS.
test = true
