[package]
name = "quark-components"
description = "Component library for Quark."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/quark-components"
keywords = ["gui", "ui", "widgets", "components"]
categories = ["gui"]

[dependencies]
accesskit.workspace = true
quark.workspace = true
quark-render.workspace = true
quark-ui.workspace = true
quark-diff.workspace = true
quark-syntax.workspace = true
quark-text.workspace = true
serde.workspace = true

[dev-dependencies]
proptest.workspace = true
# `view_equivalence` counts what the macro's lowering allocates.
quark-ui = { workspace = true, features = ["test-alloc"] }

[lints.rust]
# `cfg(kani)` gates the bounded model checking harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
