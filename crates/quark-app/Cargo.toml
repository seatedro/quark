[package]
name = "quark-app"
description = "Window, event loop, input routing, and hot reload for Quark apps."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
quark.workspace = true
quark-render.workspace = true
accesskit.workspace = true
accesskit_winit.workspace = true
arboard.workspace = true
glyphon.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
winit.workspace = true
subsecond = { workspace = true, optional = true }
tungstenite = { workspace = true, optional = true }
serde_json = { version = "1.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSButton", "NSControl", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }

[dev-dependencies]
quark-render = { workspace = true, features = ["headless-render"] }
image.workspace = true

[features]
hot-reload = ["dep:subsecond", "dep:tungstenite", "dep:serde_json"]
