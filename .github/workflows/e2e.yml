name: E2E

on:
  push:
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Drives real example apps through the AT-SPI tree with the cua driver on
  # Xvfb + openbox. See e2e/run.sh.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libdbus-1-dev libgl1-mesa-dev \
            mesa-vulkan-drivers libegl1 libgl1-mesa-dri \
            xvfb openbox x11-utils at-spi2-core dbus dbus-x11 python3-dbus

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: e2e

      # Debug builds (opt-level 1): quicker to build, and debug assertions
      # turn integrity violations into spec failures.
      - name: Build examples
        run: cargo build -p quark-app --examples --features ui,notifications

      - name: Install cua driver
        run: e2e/install-cua.sh

      - name: Run specs
        env:
          # lavapipe provides the wgpu adapter under Xvfb.
          WGPU_BACKEND: vulkan
        run: e2e/run.sh

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts
          path: |
            target/e2e/artifacts/**/*.png
            target/e2e/artifacts/**/*.txt
            target/e2e/artifacts/**/*.log
          if-no-files-found: ignore
