name: E2E

# The same events and grouping as ci.yml; see the comments there.
on:
  push:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: e2e-${{ (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && format('full-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether a run that is not full verification changed only documentation
  # no check reads (.github/scripts/docs-only.sh); then e2e skips. As in
  # ci.yml; full verification always runs everything.
  changes:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      # Full history without file contents: enough for the merge base and
      # the changed path names.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/scripts

      - name: Classify changes
        id: classify
        env:
          FULL: ${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          docs_only=false
          if [ "$FULL" != true ]; then
            if [ "$EVENT" = pull_request ]; then base=$PR_BASE; else base=origin/master; fi
            # From the merge base, so the whole branch counts and not only
            # its last push. A git failure leaves docs_only=false.
            if mb=$(git merge-base "$base" HEAD) && changed=$(git diff --no-renames --name-only "$mb" HEAD); then
              echo "$changed"
              docs_only=$(.github/scripts/docs-only.sh <<<"$changed" || echo false)
            fi
          fi
          echo "docs-only: $docs_only"
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

  # Drives real example apps through the AT-SPI tree with the cua driver on
  # Xvfb + openbox. See e2e/run.sh.
  e2e:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # CI builds drop debuginfo (dev keeps debug = 1 for local work) and
      # incremental state, which a fresh runner never reuses. Assertions and
      # overflow checks stay on. Rerun without these for full debuginfo.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        # A stalled mirror otherwise hangs the job until its 6 h limit.
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libdbus-1-dev libgl1-mesa-dev \
            mesa-vulkan-drivers libegl1 libgl1-mesa-dri \
            xvfb openbox x11-utils xdotool at-spi2-core dbus dbus-x11 python3-dbus python3-pil \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev glib-networking

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # kache caches each rustc call by its inputs, workspace crates
      # included, in the quark-kache R2 bucket. Only master writes; kache
      # also keeps pull requests and unprotected branches read-only. Without
      # the secrets (fork pull requests) it falls back to the Actions cache.
      # cache-executables covers proc macros and build scripts too.
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          cache-key-prefix: kache-e2e
          s3-bucket: ${{ secrets.KACHE_S3_ACCESS_KEY_ID != '' && 'quark-kache' || '' }}
          s3-endpoint: https://d996894143090cc02f1539e379655b2c.r2.cloudflarestorage.com
          s3-region: auto
          s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          pr-comment: false
          cache-executables: true

      # Debug builds (opt-level 1): quicker to build, and debug assertions
      # turn integrity violations into spec failures.
      # The workbench links quark-terminal, which builds libghostty-vt with
      # Zig 0.16.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Build examples
        run: |
          cargo build -p quark-app --examples --features ui,notifications
          # Only webview_demo takes the webview feature (WebKitGTK, above);
          # the other examples stay as apps without it build them.
          cargo build -p quark-app --example webview_demo --features ui,webview
          cargo build -p quark-workbench --bin workbench
          cargo build -p quark-codex --bin codex-demo

      - name: Install cua driver
        run: e2e/install-cua.sh

      - name: Run specs
        env:
          # lavapipe provides the wgpu adapter under Xvfb.
          WGPU_BACKEND: vulkan
        run: e2e/run.sh

      # Full kache counters (hits, misses, passthroughs, remote) for judging
      # the cache; informational, so it never fails the job.
      - name: Cache diagnostics
        if: always()
        continue-on-error: true
        run: |
          kache --version
          kache daemon status
          kache stats --full || kache stats

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts
          path: |
            target/e2e/artifacts/**/*.png
            target/e2e/artifacts/**/*.txt
            target/e2e/artifacts/**/*.log
          if-no-files-found: ignore
