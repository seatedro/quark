name: E2E

on:
  push:
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Drives real example apps through the AT-SPI tree with the cua driver on
  # Xvfb + openbox. See e2e/run.sh.
  e2e:
    runs-on: ubuntu-latest
    # Report-only while the baseline settles (TEST_BIBLE: conformance suites
    # report without failing until they pass). Remove this line once the job
    # has been green on two consecutive runs of main.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libdbus-1-dev libgl1-mesa-dev \
            mesa-vulkan-drivers libegl1 libgl1-mesa-dri \
            xvfb openbox x11-utils at-spi2-core dbus dbus-x11 python3-dbus

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e

      # Release codegen without the slow parts of the release profile (thin
      # LTO, one codegen unit): optimized enough to behave like a shipped app.
      - name: Build examples
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release -p quark-app --examples --features ui,notifications

      - name: Install cua driver
        run: e2e/install-cua.sh

      - name: Run specs
        env:
          # lavapipe provides the wgpu adapter under Xvfb.
          WGPU_BACKEND: vulkan
        run: e2e/run.sh

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            target/e2e/artifacts/**/*.png
            target/e2e/artifacts/**/*.txt
            target/e2e/artifacts/**/*.log
          if-no-files-found: ignore
