name: CI

on:
  # Every branch push runs CI, and so do pull requests from forks. A pull
  # request from a branch of this repository would repeat that branch's push
  # run for the same commit, so its jobs skip (the `if`s below).
  push:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Master pushes, merge groups and manual runs are full verification: each
# gets a group of its own, so a later master push never cancels or replaces
# an earlier one's. Other runs share a group per ref and cancel superseded
# runs.
concurrency:
  group: ci-${{ (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && format('full-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to commit SHAs; the comment names the release.
jobs:
  check:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        # A stalled mirror otherwise hangs the job until its 6 h limit.
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libdbus-1-dev libgl1-mesa-dev \
            mesa-vulkan-drivers libegl1 libgl1-mesa-dri

      # rustup reads the dated nightly from rust-toolchain.toml here.
      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      # quark-terminal builds libghostty-vt from Ghostty's source with Zig
      # (sources downloaded with curl, see its build.rs). Only quark-terminal
      # and its terminal_demo example need it.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # kache caches each rustc call by its inputs, workspace crates
      # included, in the quark-kache R2 bucket. Only master writes; kache
      # also keeps pull requests and unprotected branches read-only. Without
      # the secrets (fork pull requests) it falls back to the Actions cache.
      # cache-executables covers proc macros and build scripts too.
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          cache-key-prefix: kache-check
          s3-bucket: ${{ secrets.KACHE_S3_ACCESS_KEY_ID != '' && 'quark-kache' || '' }}
          s3-endpoint: https://d996894143090cc02f1539e379655b2c.r2.cloudflarestorage.com
          s3-region: auto
          s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          pr-comment: false
          cache-executables: true

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Every optional feature at once, so feature-gated code keeps
      # compiling. profile-tracy is left out: it and profile-puffin each
      # install a global profiler backend and cannot be enabled together.
      # Apps build the library without test-support; test builds always
      # turn it on, so check the plain library separately.
      - name: Check library as apps build it
        run: cargo check --workspace --lib

      - name: Check all features
        run: >-
          cargo check --workspace --all-targets --features
          quark-app/hot-reload,quark-app/syntax-download,quark-app/notifications,quark-app/tray,quark-app/dialogs,quark-app/clipboard-image,quark-app/devtools,quark-app/profile-puffin,quark-app/autostart,quark-app/global-shortcut,quark-app/telemetry,quark-render/headless-render,quark-syntax/download,quark-ui/syntax-download,quark-ui/devtools,quark-ui/profile,quark-text/profile

      # The grammar packs that quark-syntax's and quark-ui's highlighting
      # tests load, built from their pinned sources like released packs:
      # Rust, plus HTML, JavaScript, CSS, and Markdown for embedded
      # languages. The build also loads each and checks its sample.
      - name: Build test grammar packs
        run: cargo run -p syntax-pack -- build rust html javascript css markdown markdown_inline

      - name: Test
        env:
          # Turns a missing wgpu adapter into a failure in the headless render
          # test instead of a silent skip; lavapipe provides the adapter.
          QUARK_REQUIRE_GPU: "1"
          # Likewise a missing grammar pack in the highlighting tests.
          QUARK_REQUIRE_SYNTAX_PACKS: "1"
          # Only takes effect once quark-render builds its Instance from env
          # (InstanceDescriptor::from_env_or_default); default backends already
          # include Vulkan.
          WGPU_BACKEND: vulkan
        # Full O(n) integrity checks after every mutation (quark-ui's feature
        # turns on quark's too); cheap debug checks run without it. `syntax`
        # runs the document's highlighting tests against the pack above.
        run: cargo test --workspace --features quark-ui/integrity-checks,quark-ui/syntax

  # macOS (Apple silicon) and Windows: the Linux job's clippy and tests, then
  # a smoke launch of hello_ui. Formatting and feature combinations are
  # platform independent and stay on Linux.
  platform:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            backend: metal
          - os: windows-latest
            # No GPU on hosted Windows runners: DX12 picks WARP, the
            # software adapter.
            backend: dx12
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      QUARK_REQUIRE_GPU: "1"
      WGPU_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy

      # quark-terminal builds libghostty-vt with Zig: for x86_64 MSVC on
      # Windows, where Zig finds the MSVC headers and Windows SDK through
      # the runner's Visual Studio.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # kache caches each rustc call by its inputs, workspace crates
      # included, in the quark-kache R2 bucket. Only master writes; kache
      # also keeps pull requests and unprotected branches read-only. Without
      # the secrets (fork pull requests) it falls back to the Actions cache.
      # cache-executables covers proc macros and build scripts too.
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          cache-key-prefix: kache-${{ matrix.os }}
          s3-bucket: ${{ secrets.KACHE_S3_ACCESS_KEY_ID != '' && 'quark-kache' || '' }}
          s3-endpoint: https://d996894143090cc02f1539e379655b2c.r2.cloudflarestorage.com
          s3-region: auto
          s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          pr-comment: false
          cache-executables: true

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Built with this platform's compiler and linker (MSVC on Windows), so
      # the tests load a dylib or DLL the way apps do.
      - name: Build test grammar packs
        run: cargo run -p syntax-pack -- build rust html javascript css markdown markdown_inline

      - name: Test
        env:
          QUARK_REQUIRE_SYNTAX_PACKS: "1"
        run: cargo test --workspace --features quark-ui/integrity-checks,quark-ui/syntax

      # QUARK_EXIT_AFTER_FRAMES (debug builds only) quits after that many
      # presented frames, so a zero exit means a window opened and drew.
      - name: Smoke run hello_ui
        run: |
          cargo build -p quark-app --example hello_ui
          bin=target/debug/examples/hello_ui
          mkdir -p target/smoke
          QUARK_EXIT_AFTER_FRAMES=1 "$bin" >target/smoke/hello_ui.log 2>&1 &
          pid=$!
          for _ in $(seq 120); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
            cat target/smoke/hello_ui.log
            echo "hello_ui did not exit within 120 s"
            exit 1
          fi
          wait "$pid" || { status=$?; cat target/smoke/hello_ui.log; echo "hello_ui exited with $status"; exit 1; }
          cat target/smoke/hello_ui.log

      - name: Screenshot hello_ui
        continue-on-error: true
        run: |
          target/debug/examples/hello_ui &
          pid=$!
          sleep 10
          if [ "$RUNNER_OS" = macOS ]; then
            screencapture -x target/smoke/hello_ui.png
          else
            powershell -NoProfile -Command '
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save("target/smoke/hello_ui.png")'
          fi
          kill "$pid"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: target/smoke/
          if-no-files-found: ignore

  fuzz:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    env:
      # ASan does not instrument libghostty-vt, so the terminal targets link
      # a ReleaseSafe build (its own cache entry): Zig's safety checks abort
      # on a violation. Job-wide so the replay steps reuse the build.
      QUARK_GHOSTTY_VT_OPTIMIZE: ReleaseSafe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        # A stalled mirror otherwise hangs the job until its 6 h limit.
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-fuzz@0.13.2

      # The terminal targets link libghostty-vt, built with Zig.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # The prebuilt cargo-fuzz binary is a musl build and defaults to that
      # target, where ASan can't link; build for the runner's gnu target.
      - name: Build fuzz targets
        run: cargo fuzz build --target x86_64-unknown-linux-gnu

      # -runs=0 executes each committed input once and stops: a regression
      # check over the corpus, not a fuzzing session.
      - name: Replay corpora
        run: |
          for target in text_layout markdown terminal_vt terminal_input; do
            cargo fuzz run --target x86_64-unknown-linux-gnu "$target" "$PWD/fuzz/corpus/$target" -- -runs=0
          done

      # Report only. Feeds every CommonMark 0.31.2 spec example through
      # MarkdownDoc::parse and verify_integrity via the markdown target. It
      # does not compare against the spec's expected HTML.
      - name: CommonMark spec examples (report only)
        continue-on-error: true
        run: |
          dir=$(mktemp -d)
          curl -fsSL --retry 3 -o "$dir/spec.txt" \
            https://raw.githubusercontent.com/commonmark/commonmark-spec/0.31.2/spec.txt
          echo "257c41ad946f7a1414a499aca402a1aa8fdac3678532266611348c1cf54f4b80  $dir/spec.txt" | sha256sum -c -
          python3 -I fuzz/commonmark_corpus.py "$dir/spec.txt" "$dir/corpus"
          cargo fuzz run --target x86_64-unknown-linux-gnu markdown "$dir/corpus" -- -runs=0

  miri:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add miri rust-src
          cargo miri setup

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # quark only: quark-text's one unsafe block copies text over an
      # unshared Arc<str> of the same length, and shaping the vendored fonts
      # under Miri takes ~16 s per layout (its properties take ~10 min each),
      # so it would mostly re-check third-party font parsing.
      - name: Miri
        env:
          # Properties drop to 4 cases under cfg(miri); the Test job runs the
          # full counts.
          # zerocopy 0.8.60 (via proptest's rand_chacha) calls
          # align_of_val_raw under cfg(miri) without enabling its feature.
          RUSTFLAGS: "-Zcrate-attr=feature(layout_for_ptr)"
        run: cargo miri test -p quark

  kani:
    name: kani (${{ matrix.name }})
    # Full verification only (master pushes, merge groups, manual runs); other
    # runs get the faster kani-pr job instead.
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    # Harnesses cover HashMap-free cores only: std's SipHash makes Kani's
    # search blow up (an earlier BlockOrder harness ran 87 minutes). Slow
    # harnesses get a job of their own so each stays within the timeout.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: quark
            args: "-p quark --harness fenwick:: --harness geometry::"
          - name: quark hit
            args: "-p quark --harness hit::"
          - name: quark reactive
            args: "-p quark --harness reactive::"
          - name: quark-ui
            args: "-p quark-ui --harness virtual_list::"
          - name: quark-ui scroll
            args: "-p quark-ui --harness scroll::"
          - name: quark-app
            args: -p quark-app
          - name: quark-components
            args: "-p quark-components --harness list_nav:: --harness slider::"
          - name: quark-components pane_tree
            args: "-p quark-components --harness pane_tree::"
          - name: quark-components split 0/1
            args: "-p quark-components --harness split_resize_pane0_flex1"
          - name: quark-components split 0/2
            args: "-p quark-components --harness split_resize_pane0_flex2"
          - name: quark-components split 1/0
            args: "-p quark-components --harness split_resize_pane1_flex0"
          - name: quark-components split 1/2
            args: "-p quark-components --harness split_resize_pane1_flex2"
          - name: quark-components split 2/0
            args: "-p quark-components --harness split_resize_pane2_flex0"
          - name: quark-components split 2/1
            args: "-p quark-components --harness split_resize_pane2_flex1"
          - name: quark-diff
            args: -p quark-diff
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        # A stalled mirror otherwise hangs the job until its 6 h limit.
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libdbus-1-dev libgl1-mesa-dev

      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.68.0"
          args: ${{ matrix.args }}

  # The faster proofs from the kani matrix above, for runs that are not full
  # verification. The slow pane_tree and split harnesses run only there.
  # Arguments must match the full matrix entry of the same name.
  kani-pr:
    name: kani-pr (${{ matrix.name }})
    if: ${{ !(github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: quark
            args: "-p quark --harness fenwick:: --harness geometry::"
          - name: quark hit
            args: "-p quark --harness hit::"
          - name: quark reactive
            args: "-p quark --harness reactive::"
          - name: quark-ui
            args: "-p quark-ui --harness virtual_list::"
          - name: quark-ui scroll
            args: "-p quark-ui --harness scroll::"
          - name: quark-app
            args: -p quark-app
          - name: quark-components
            args: "-p quark-components --harness list_nav:: --harness slider::"
          - name: quark-diff
            args: -p quark-diff
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        # A stalled mirror otherwise hangs the job until its 6 h limit.
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libdbus-1-dev libgl1-mesa-dev

      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.68.0"
          args: ${{ matrix.args }}

  # One check to require: fails on any failed, cancelled or unexpectedly
  # skipped job. The only expected skips are the event split between full
  # verification and the faster PR jobs.
  ci-result:
    if: ${{ always() && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [check, platform, fuzz, miri, kani, kani-pr]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          FULL: ${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          fast=$([ "$FULL" = true ] && echo false || echo true)
          fail=0
          # expect JOB SHOULD_RUN: a job that should run must succeed; one that
          # should not must be skipped.
          expect() {
            result=$(jq -r --arg job "$1" '.[$job].result' <<<"$NEEDS")
            want=$([ "$2" = true ] && echo success || echo skipped)
            echo "$1: $result (want $want)"
            [ "$result" = "$want" ] || fail=1
          }
          expect check true
          expect platform true
          expect fuzz true
          expect miri true
          expect kani "$FULL"
          expect kani-pr "$fast"
          exit "$fail"
