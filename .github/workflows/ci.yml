name: CI

on:
  # Every branch push runs CI, and so do pull requests from forks. A pull
  # request from a branch of this repository would repeat that branch's push
  # run for the same commit, so its jobs skip (the `if`s below).
  push:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Master pushes, merge groups and manual runs are full verification: each
# gets a group of its own, so a later master push never cancels or replaces
# an earlier one's. Other runs share a group per ref and cancel superseded
# runs.
concurrency:
  group: ci-${{ (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && format('full-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to commit SHAs; the comment names the release.
jobs:
  # Whether a run that is not full verification changed only documentation
  # no check reads (.github/scripts/docs-only.sh); then the build, test and
  # proof jobs skip. Full verification always runs everything.
  changes:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      # Full history without file contents: enough for the merge base and
      # the changed path names.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/scripts

      - name: Classify changes
        id: classify
        env:
          FULL: ${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          docs_only=false
          if [ "$FULL" != true ]; then
            if [ "$EVENT" = pull_request ]; then base=$PR_BASE; else base=origin/master; fi
            # From the merge base, so the whole branch counts and not only
            # its last push. A git failure leaves docs_only=false.
            if mb=$(git merge-base "$base" HEAD) && changed=$(git diff --no-renames --name-only "$mb" HEAD); then
              echo "$changed"
              docs_only=$(.github/scripts/docs-only.sh <<<"$changed" || echo false)
            fi
          fi
          echo "docs-only: $docs_only"
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    env:
      # CI builds drop debuginfo (dev keeps debug = 1 for local work) and
      # incremental state, which a fresh runner never reuses. Assertions and
      # overflow checks stay on. Rerun without these for full debuginfo.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        # A stalled mirror otherwise hangs the job until its 6 h limit.
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libdbus-1-dev libgl1-mesa-dev \
            mesa-vulkan-drivers libegl1 libgl1-mesa-dri

      # rustup reads the dated nightly from rust-toolchain.toml here.
      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      # quark-terminal builds libghostty-vt from Ghostty's source with Zig
      # (sources downloaded with curl, see its build.rs). Only quark-terminal
      # and its terminal_demo example need it.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # kache caches each rustc call by its inputs, workspace crates
      # included, in the quark-kache R2 bucket. Only master writes; kache
      # also keeps pull requests and unprotected branches read-only. Without
      # the secrets (fork pull requests) it falls back to the Actions cache.
      # cache-executables covers proc macros and build scripts too.
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          cache-key-prefix: kache-check
          s3-bucket: ${{ secrets.KACHE_S3_ACCESS_KEY_ID != '' && 'quark-kache' || '' }}
          s3-endpoint: https://d996894143090cc02f1539e379655b2c.r2.cloudflarestorage.com
          s3-region: auto
          s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          pr-comment: false
          cache-executables: true

      - name: Format
        run: cargo fmt --all --check

      - name: Format views
        run: cargo run --locked -p quark-fmt --bin quark-fmt -- --all --view-only --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Every optional feature at once, so feature-gated code keeps
      # compiling. profile-tracy is left out: it and profile-puffin each
      # install a global profiler backend and cannot be enabled together.
      # Apps build the library without test-support; test builds always
      # turn it on, so check the plain library separately.
      - name: Check library as apps build it
        run: cargo check --workspace --lib

      - name: Check all features
        run: >-
          cargo check --workspace --all-targets --features
          quark-app/hot-reload,quark-app/syntax-download,quark-app/notifications,quark-app/tray,quark-app/dialogs,quark-app/clipboard-image,quark-app/devtools,quark-app/profile-puffin,quark-app/autostart,quark-app/global-shortcut,quark-app/telemetry,quark-render/headless-render,quark-syntax/download,quark-ui/syntax-download,quark-ui/devtools,quark-ui/profile,quark-text/profile

      # The grammar packs that quark-syntax's and quark-ui's highlighting
      # tests load, built from their pinned sources like released packs:
      # Rust, plus HTML, JavaScript, CSS, and Markdown for embedded
      # languages. The build also loads each and checks its sample.
      - name: Build test grammar packs
        run: cargo run -p syntax-pack -- build rust html javascript css markdown markdown_inline python

      # Compiled apart from the run so step timings separate the two.
      - name: Build tests
        run: cargo test --workspace --features quark-ui/integrity-checks,quark-ui/syntax,quark-app/syntax --no-run

      - name: Test
        env:
          # Turns a missing wgpu adapter into a failure in the headless render
          # test instead of a silent skip; lavapipe provides the adapter.
          QUARK_REQUIRE_GPU: "1"
          # Likewise a missing grammar pack in the highlighting tests.
          QUARK_REQUIRE_SYNTAX_PACKS: "1"
          # Only takes effect once quark-render builds its Instance from env
          # (InstanceDescriptor::from_env_or_default); default backends already
          # include Vulkan.
          WGPU_BACKEND: vulkan
        # Full O(n) integrity checks after every mutation (quark-ui's feature
        # turns on quark's too); cheap debug checks run without it. `syntax`
        # runs the document's highlighting tests against the pack above.
        run: cargo test --workspace --features quark-ui/integrity-checks,quark-ui/syntax,quark-app/syntax

      # Full kache counters (hits, misses, passthroughs, remote) for judging
      # the cache; informational, so it never fails the job.
      - name: Cache diagnostics
        if: always()
        continue-on-error: true
        run: |
          kache --version
          kache daemon status
          kache stats --full || kache stats

  # quark-app's webview feature on Linux against WebKitGTK 4.1, then the
  # webview smoke test under Xvfb. Apart from `check`, which proves builds
  # without the feature need no GTK or WebKit packages.
  webview:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        # A stalled mirror otherwise hangs the job until its 6 h limit.
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libdbus-1-dev libgl1-mesa-dev \
            mesa-vulkan-drivers libegl1 libgl1-mesa-dri \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev glib-networking \
            libxkbcommon-x11-0 xvfb openbox dbus-x11 at-spi2-core

      # wry's async evaluation and policy APIs need WebKitGTK 2.40.
      - name: Check WebKitGTK
        run: |
          pkg-config --modversion gtk+-3.0 webkit2gtk-4.1 javascriptcoregtk-4.1 libsoup-3.0
          pkg-config --atleast-version=2.40 webkit2gtk-4.1

      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy

      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          cache-key-prefix: kache-webview
          s3-bucket: ${{ secrets.KACHE_S3_ACCESS_KEY_ID != '' && 'quark-kache' || '' }}
          s3-endpoint: https://d996894143090cc02f1539e379655b2c.r2.cloudflarestorage.com
          s3-region: auto
          s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          pr-comment: false
          cache-executables: true

      - name: Clippy
        run: cargo clippy --locked -p quark-webview -p quark-app --features quark-app/webview --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked -p quark-webview --features native

      # A session bus and a window manager, as on a desktop; the browser
      # sandbox stays on.
      - name: Smoke test
        timeout-minutes: 15
        run: >-
          xvfb-run -a -s "-screen 0 1280x800x24"
          dbus-run-session --
          sh -c 'openbox & cargo test --locked -p quark-app --features webview --test webview_smoke'

  # macOS (Apple silicon) and Windows: the Linux job's clippy and tests, then
  # a smoke launch of hello_ui. Formatting and feature combinations are
  # platform independent and stay on Linux.
  platform:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            backend: metal
          - os: windows-latest
            # No GPU on hosted Windows runners: DX12 picks WARP, the
            # software adapter.
            backend: dx12
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      QUARK_REQUIRE_GPU: "1"
      WGPU_BACKEND: ${{ matrix.backend }}
      # CI builds drop debuginfo (dev keeps debug = 1 for local work) and
      # incremental state, which a fresh runner never reuses. Assertions and
      # overflow checks stay on. Rerun without these for full debuginfo.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy

      # quark-terminal builds libghostty-vt with Zig: for x86_64 MSVC on
      # Windows, where Zig finds the MSVC headers and Windows SDK through
      # the runner's Visual Studio.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # kache caches each rustc call by its inputs, workspace crates
      # included, in the quark-kache R2 bucket. Only master writes; kache
      # also keeps pull requests and unprotected branches read-only. Without
      # the secrets (fork pull requests) it falls back to the Actions cache.
      # cache-executables covers proc macros and build scripts too.
      # Not on Windows: kache 1.0.0 runs ring's and tree-sitter's rustc calls
      # uncached there (cc writes both libNAME.a and NAME.lib, which kache
      # rejects as ambiguous), and copies between the C: and D: volumes.
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        if: runner.os != 'Windows'
        with:
          cache-key-prefix: kache-${{ matrix.os }}
          s3-bucket: ${{ secrets.KACHE_S3_ACCESS_KEY_ID != '' && 'quark-kache' || '' }}
          s3-endpoint: https://d996894143090cc02f1539e379655b2c.r2.cloudflarestorage.com
          s3-region: auto
          s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          pr-comment: false
          cache-executables: true

      # Windows caches the dependencies' target outputs instead, in the
      # workspace's target directory on the build volume. Only master saves.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.os == 'Windows'
        with:
          key: windows-native-v1
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # libghostty-vt, which build.rs stages under target/debug/ghostty-vt
      # by a key of Ghostty commit, target, mode, Zig version and CRT. No
      # rustc cache covers this Zig build, so it gets its own entry rather
      # than relying on rust-cache's target cleanup to keep it.
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        if: runner.os == 'Windows'
        id: ghostty-vt
        with:
          path: target/debug/ghostty-vt
          key: ghostty-vt-${{ runner.os }}-${{ runner.arch }}-zig0.16.0-${{ hashFiles('crates/quark-terminal/build.rs') }}-v1

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The WKWebView and WebView2 backends; Linux's is the webview job.
      - name: Clippy webview
        run: cargo clippy -p quark-webview -p quark-app --features quark-app/webview --all-targets -- -D warnings

      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        if: success() && runner.os == 'Windows' && github.ref == 'refs/heads/master' && steps.ghostty-vt.outputs.cache-hit != 'true'
        with:
          path: target/debug/ghostty-vt
          key: ${{ steps.ghostty-vt.outputs.cache-primary-key }}

      # Built with this platform's compiler and linker (MSVC on Windows), so
      # the tests load a dylib or DLL the way apps do.
      - name: Build test grammar packs
        run: cargo run -p syntax-pack -- build rust html javascript css markdown markdown_inline python

      # Compiled apart from the run so step timings separate the two.
      - name: Build tests
        run: cargo test --workspace --features quark-ui/integrity-checks,quark-ui/syntax,quark-app/syntax --no-run

      - name: Test
        env:
          QUARK_REQUIRE_SYNTAX_PACKS: "1"
        run: cargo test --workspace --features quark-ui/integrity-checks,quark-ui/syntax,quark-app/syntax

      # The WKWebView backend against the local fixture. The script wraps
      # the test binary in a .app and `open`s it: AppKit gives windows only
      # to a process LaunchServices starts.
      - name: Webview smoke
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: crates/quark-app/tests/webview/macos/run-macos-smoke.sh

      # QUARK_EXIT_AFTER_FRAMES (debug builds only) quits after that many
      # presented frames, so a zero exit means a window opened and drew.
      - name: Smoke run hello_ui
        run: |
          cargo build -p quark-app --example hello_ui
          bin=target/debug/examples/hello_ui
          mkdir -p target/smoke
          QUARK_EXIT_AFTER_FRAMES=1 "$bin" >target/smoke/hello_ui.log 2>&1 &
          pid=$!
          for _ in $(seq 120); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
            cat target/smoke/hello_ui.log
            echo "hello_ui did not exit within 120 s"
            exit 1
          fi
          wait "$pid" || { status=$?; cat target/smoke/hello_ui.log; echo "hello_ui exited with $status"; exit 1; }
          cat target/smoke/hello_ui.log

      - name: Screenshot hello_ui
        continue-on-error: true
        run: |
          target/debug/examples/hello_ui &
          pid=$!
          sleep 10
          if [ "$RUNNER_OS" = macOS ]; then
            screencapture -x target/smoke/hello_ui.png
          else
            powershell -NoProfile -Command '
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save("target/smoke/hello_ui.png")'
          fi
          kill "$pid"

      # Full kache counters (hits, misses, passthroughs, remote) for judging
      # the cache; informational, so it never fails the job.
      - name: Cache diagnostics
        if: always() && runner.os != 'Windows'
        continue-on-error: true
        run: |
          kache --version
          kache daemon status
          kache stats --full || kache stats

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: target/smoke/
          if-no-files-found: ignore

  fuzz:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    env:
      # ASan does not instrument libghostty-vt, so the terminal targets link
      # a ReleaseSafe build (its own cache entry): Zig's safety checks abort
      # on a violation. Job-wide so the replay steps reuse the build.
      QUARK_GHOSTTY_VT_OPTIMIZE: ReleaseSafe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        # A stalled mirror otherwise hangs the job until its 6 h limit.
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-fuzz@0.13.2

      # The terminal targets link libghostty-vt, built with Zig.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # The prebuilt cargo-fuzz binary is a musl build and defaults to that
      # target, where ASan can't link; build for the runner's gnu target.
      - name: Build fuzz targets
        run: cargo fuzz build --target x86_64-unknown-linux-gnu

      # -runs=0 executes each committed input once and stops: a regression
      # check over the corpus, not a fuzzing session.
      - name: Replay corpora
        run: |
          for target in text_layout markdown terminal_vt terminal_input; do
            cargo fuzz run --target x86_64-unknown-linux-gnu "$target" "$PWD/fuzz/corpus/$target" -- -runs=0
          done

      # Report only. Feeds every CommonMark 0.31.2 spec example through
      # MarkdownDoc::parse and verify_integrity via the markdown target. It
      # does not compare against the spec's expected HTML.
      - name: CommonMark spec examples (report only)
        continue-on-error: true
        run: |
          dir=$(mktemp -d)
          curl -fsSL --retry 3 -o "$dir/spec.txt" \
            https://raw.githubusercontent.com/commonmark/commonmark-spec/0.31.2/spec.txt
          echo "257c41ad946f7a1414a499aca402a1aa8fdac3678532266611348c1cf54f4b80  $dir/spec.txt" | sha256sum -c -
          python3 -I fuzz/commonmark_corpus.py "$dir/spec.txt" "$dir/corpus"
          cargo fuzz run --target x86_64-unknown-linux-gnu markdown "$dir/corpus" -- -runs=0

  # The original Miri suite, one interpreter running every test: it alone can
  # catch races between tests that share process state, so it stays the
  # full verification check.
  miri:
    # Full verification only (master pushes, merge groups, manual runs); other
    # runs get the parallel miri-pr job instead.
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add miri rust-src
          echo "MIRI_SYSROOT=$RUNNER_TEMP/miri-sysroot" >> "$GITHUB_ENV"

      # The sysroot Miri builds for the dated nightly in rust-toolchain.toml.
      # setup only rebuilds it when it does not match the toolchain.
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: miri-sysroot
        with:
          path: ${{ env.MIRI_SYSROOT }}
          key: miri-sysroot-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-v1

      - name: Miri setup
        run: cargo miri setup

      # Shared with miri-pr, which only reads it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: miri-v1
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # quark only: quark-text's one unsafe block copies text over an
      # unshared Arc<str> of the same length, and shaping the vendored fonts
      # under Miri takes ~16 s per layout (its properties take ~10 min each),
      # so it would mostly re-check third-party font parsing.
      - name: Miri
        env:
          # Properties drop to 4 cases under cfg(miri); the Test job runs the
          # full counts.
          # zerocopy 0.8.60 (via proptest's rand_chacha) calls
          # align_of_val_raw under cfg(miri) without enabling its feature.
          RUSTFLAGS: "-Zcrate-attr=feature(layout_for_ptr)"
        run: cargo miri test -p quark

      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        if: success() && github.ref == 'refs/heads/master' && steps.miri-sysroot.outputs.cache-hit != 'true'
        with:
          path: ${{ env.MIRI_SYSROOT }}
          key: ${{ steps.miri-sysroot.outputs.cache-primary-key }}

  # The same tests and flags as the miri job, run by nextest as one process
  # per test so four interpreters work at once. Nextest skips doctests, which
  # get their own step.
  miri-pr:
    needs: changes
    if: ${{ !(github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add miri rust-src
          echo "MIRI_SYSROOT=$RUNNER_TEMP/miri-sysroot" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ env.MIRI_SYSROOT }}
          key: miri-sysroot-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-v1

      - name: Miri setup
        run: cargo miri setup

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: miri-v1
          save-if: "false"

      # The action's pinned manifest fixes the nextest version.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest

      # Uses the default-miri profile in .config/nextest.toml.
      - name: Miri
        env:
          # As in the miri job; properties drop to 4 cases under cfg(miri).
          RUSTFLAGS: "-Zcrate-attr=feature(layout_for_ptr)"
        # The 30k-block linearity test alone takes ~15 minutes under Miri
        # (915 of 947 s); the master miri job still runs it.
        run: cargo miri nextest run -p quark --test-threads 4 --no-fail-fast -E 'not test(=selection::tests::appending_30k_blocks_one_at_a_time_checks_linearly)'

      - name: Miri doctests
        if: success() || failure()
        env:
          RUSTFLAGS: "-Zcrate-attr=feature(layout_for_ptr)"
        run: cargo miri test -p quark --doc

  kani:
    name: kani (${{ matrix.name }})
    # Full verification only (master pushes, merge groups, manual runs); other
    # runs get the faster kani-pr job instead.
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    # Harnesses cover HashMap-free cores only: std's SipHash makes Kani's
    # search blow up (an earlier BlockOrder harness ran 87 minutes). Slow
    # harnesses get a job of their own so each stays within the timeout.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: quark
            args: "-p quark --harness fenwick:: --harness geometry::"
            package: quark
            cache-writer: true
          - name: quark hit
            args: "-p quark --harness hit::"
            package: quark
          - name: quark reactive
            args: "-p quark --harness reactive::"
            package: quark
          - name: quark-ui
            args: "-p quark-ui --harness virtual_list::"
            package: quark-ui
            cache-writer: true
          - name: quark-ui scroll
            args: "-p quark-ui --harness scroll::"
            package: quark-ui
          - name: quark-app
            args: -p quark-app
            package: quark-app
            cache-writer: true
          - name: quark-components
            args: "-p quark-components --harness list_nav:: --harness slider::"
            package: quark-components
            cache-writer: true
          # pane_tree's dividers are separate harnesses so they prove in
          # parallel.
          - name: quark-components pane_tree 0
            args: "-p quark-components --harness pane_tree::verification::push_divider_0"
            package: quark-components
          - name: quark-components pane_tree 1
            args: "-p quark-components --harness pane_tree::verification::push_divider_1"
            package: quark-components
          - name: quark-components pane_tree 2
            args: "-p quark-components --harness pane_tree::verification::push_divider_2"
            package: quark-components
          - name: quark-components split 0/1
            args: "-p quark-components --harness split_resize_pane0_flex1"
            package: quark-components
          - name: quark-components split 0/2
            args: "-p quark-components --harness split_resize_pane0_flex2"
            package: quark-components
          - name: quark-components split 1/0
            args: "-p quark-components --harness split_resize_pane1_flex0"
            package: quark-components
          - name: quark-components split 1/2
            args: "-p quark-components --harness split_resize_pane1_flex2"
            package: quark-components
          - name: quark-components split 2/0
            args: "-p quark-components --harness split_resize_pane2_flex0"
            package: quark-components
          - name: quark-components split 2/1
            args: "-p quark-components --harness split_resize_pane2_flex1"
            package: quark-components
          - name: quark-diff
            args: -p quark-diff
            package: quark-diff
            cache-writer: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        # A stalled mirror otherwise hangs the job until its 6 h limit.
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libdbus-1-dev libgl1-mesa-dev time

      # Install only: the steps below compile and then prove, so their
      # timings separate the two.
      - name: Install Kani
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.68.0"
          command: cargo-kani
          args: --version

      # Kani's build of the package and its dependencies. A restore is only a
      # head start: cargo kani rebuilds whatever is stale and still proves
      # every selected harness. One entry per package (cache-writer) saves,
      # on master, when the dependencies changed.
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: kani-build
        with:
          path: target/kani
          key: kani-${{ matrix.package }}-${{ runner.os }}-${{ runner.arch }}-0.68.0-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/**') }}
          restore-keys: |
            kani-${{ matrix.package }}-${{ runner.os }}-${{ runner.arch }}-0.68.0-

      - name: Kani compile
        id: kani-compile
        run: /usr/bin/time -v cargo kani ${{ matrix.args }} --only-codegen

      - name: Kani prove
        run: /usr/bin/time -v cargo kani ${{ matrix.args }}

      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        if: always() && steps.kani-compile.outcome == 'success' && matrix.cache-writer && github.ref == 'refs/heads/master' && steps.kani-build.outputs.cache-hit != 'true'
        with:
          path: target/kani
          key: ${{ steps.kani-build.outputs.cache-primary-key }}

  # The faster proofs from the kani matrix above, for runs that are not full
  # verification. The slow pane_tree and split harnesses run only there.
  # Arguments must match the full matrix entry of the same name.
  kani-pr:
    name: kani-pr (${{ matrix.name }})
    needs: changes
    if: ${{ !(github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: quark
            args: "-p quark --harness fenwick:: --harness geometry::"
            package: quark
          - name: quark hit
            args: "-p quark --harness hit::"
            package: quark
          - name: quark reactive
            args: "-p quark --harness reactive::"
            package: quark
          - name: quark-ui
            args: "-p quark-ui --harness virtual_list::"
            package: quark-ui
          - name: quark-ui scroll
            args: "-p quark-ui --harness scroll::"
            package: quark-ui
          - name: quark-app
            args: -p quark-app
            package: quark-app
          - name: quark-components
            args: "-p quark-components --harness list_nav:: --harness slider::"
            package: quark-components
          - name: quark-diff
            args: -p quark-diff
            package: quark-diff
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        # A stalled mirror otherwise hangs the job until its 6 h limit.
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libdbus-1-dev libgl1-mesa-dev time

      - name: Install Kani
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.68.0"
          command: cargo-kani
          args: --version

      # The build the kani job saves on master; see there.
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: kani-build
        with:
          path: target/kani
          key: kani-${{ matrix.package }}-${{ runner.os }}-${{ runner.arch }}-0.68.0-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/**') }}
          restore-keys: |
            kani-${{ matrix.package }}-${{ runner.os }}-${{ runner.arch }}-0.68.0-

      - name: Kani compile
        id: kani-compile
        run: /usr/bin/time -v cargo kani ${{ matrix.args }} --only-codegen

      - name: Kani prove
        run: /usr/bin/time -v cargo kani ${{ matrix.args }}

  # One check to require: fails on any failed, cancelled or unexpectedly
  # skipped job. The only expected skips are the event split between full
  # verification and the faster PR jobs, and documentation-only changes.
  ci-result:
    if: ${{ always() && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [changes, check, webview, platform, fuzz, miri, miri-pr, kani, kani-pr]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          FULL: ${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only == 'true' }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          native=$([ "$DOCS_ONLY" = true ] && echo false || echo true)
          fast=$([ "$FULL" = false ] && [ "$native" = true ] && echo true || echo false)
          fail=0
          # expect JOB SHOULD_RUN: a job that should run must succeed; one that
          # should not must be skipped.
          expect() {
            result=$(jq -r --arg job "$1" '.[$job].result' <<<"$NEEDS")
            want=$([ "$2" = true ] && echo success || echo skipped)
            echo "$1: $result (want $want)"
            [ "$result" = "$want" ] || fail=1
          }
          expect changes true
          expect check "$native"
          expect webview "$native"
          expect platform "$native"
          expect fuzz "$native"
          expect miri "$FULL"
          expect miri-pr "$fast"
          expect kani "$FULL"
          expect kani-pr "$fast"
          exit "$fail"
