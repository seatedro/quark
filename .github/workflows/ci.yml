name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to commit SHAs; the comment names the release.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libdbus-1-dev libgl1-mesa-dev \
            mesa-vulkan-drivers libegl1 libgl1-mesa-dri

      # rustup reads the dated nightly from rust-toolchain.toml here.
      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      # Crates with no clippy warnings, denied so they stay that way.
      # --no-deps keeps clippy off the workspace crates they depend on.
      - name: Clippy (gated crates)
        run: cargo clippy --no-deps -p quark -p quark-macros -p quark-components --all-targets -- -D warnings

      # TODO: deny here once quark-ui's warnings are fixed (and quark-text,
      # quark-render, quark-syntax, and quark-app stay clean through their
      # in-flight branches); then the step above can go.
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets

      # Every optional feature at once, so feature-gated code keeps
      # compiling. profile-tracy is left out: it and profile-puffin each
      # install a global profiler backend and cannot be enabled together.
      - name: Check all features
        run: >-
          cargo check --workspace --all-targets --features
          quark-app/hot-reload,quark-app/syntax,quark-app/notifications,quark-app/tray,quark-app/dialogs,quark-app/clipboard-image,quark-app/devtools,quark-app/profile-puffin,quark-render/headless-render,quark-syntax/common,quark-ui/syntax,quark-ui/devtools,quark-ui/profile,quark-text/profile

      - name: Test
        env:
          # Turns a missing wgpu adapter into a failure in the headless render
          # test instead of a silent skip; lavapipe provides the adapter.
          QUARK_REQUIRE_GPU: "1"
          # Only takes effect once quark-render builds its Instance from env
          # (InstanceDescriptor::from_env_or_default); default backends already
          # include Vulkan.
          WGPU_BACKEND: vulkan
        # Full O(n) integrity checks after every mutation (quark-ui's feature
        # turns on quark's too); cheap debug checks run without it.
        run: cargo test --workspace --features quark-ui/integrity-checks

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-fuzz@0.13.2

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz

      - name: Build fuzz targets
        run: cargo fuzz build

      # -runs=0 executes each committed input once and stops: a regression
      # check over the corpus, not a fuzzing session.
      - name: Replay corpora
        run: |
          for target in text_layout markdown; do
            cargo fuzz run "$target" "$PWD/fuzz/corpus/$target" -- -runs=0
          done

      # Report only. Feeds every CommonMark 0.31.2 spec example through
      # MarkdownDoc::parse and verify_integrity via the markdown target. It
      # does not compare against the spec's expected HTML.
      - name: CommonMark spec examples (report only)
        continue-on-error: true
        run: |
          dir=$(mktemp -d)
          curl -fsSL --retry 3 -o "$dir/spec.txt" \
            https://raw.githubusercontent.com/commonmark/commonmark-spec/0.31.2/spec.txt
          echo "257c41ad946f7a1414a499aca402a1aa8fdac3678532266611348c1cf54f4b80  $dir/spec.txt" | sha256sum -c -
          python3 -I fuzz/commonmark_corpus.py "$dir/spec.txt" "$dir/corpus"
          cargo fuzz run markdown "$dir/corpus" -- -runs=0

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add miri rust-src
          cargo miri setup

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # quark only: quark-text has no unsafe of its own, and shaping the
      # vendored fonts under Miri takes ~16 s per layout (its properties take
      # ~10 min each), so it would only re-check third-party font parsing.
      - name: Miri
        env:
          # Properties drop to 4 cases under cfg(miri); the Test job runs the
          # full counts.
          # zerocopy 0.8.60 (via proptest's rand_chacha) calls
          # align_of_val_raw under cfg(miri) without enabling its feature.
          RUSTFLAGS: "-Zcrate-attr=feature(layout_for_ptr)"
        run: cargo miri test -p quark

  kani:
    runs-on: ubuntu-latest
    # Harnesses cover HashMap-free cores only: std's SipHash makes Kani's
    # search blow up (an earlier BlockOrder harness ran 87 minutes).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.68.0"
          args: -p quark
