# Temporary: iterates on the ConPTY test on Windows. Not to be merged.
name: conpty-debug

on:
  push:
    branches: [fix/conpty]

concurrency:
  group: conpty-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  pty:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          cache-key-prefix: kache-windows-latest
          s3-bucket: ${{ secrets.KACHE_S3_ACCESS_KEY_ID != '' && 'quark-kache' || '' }}
          s3-endpoint: https://d996894143090cc02f1539e379655b2c.r2.cloudflarestorage.com
          s3-region: auto
          s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
          save-cache: false
          pr-comment: false
          cache-executables: true

      - name: Windows version
        run: cmd //c ver

      - name: PTY tests
        env:
          QUARK_PTY_DEBUG: "1"
        run: cargo test -p quark-terminal --lib pty -- --nocapture
