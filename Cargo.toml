[workspace]
resolver = "3"
members = [
  "crates/quark",
  "crates/quark-macros",
  "crates/quark-render",
  "crates/quark-text",
  "crates/quark-diff",
  "crates/quark-i18n",
  "crates/quark-syntax",
  "crates/quark-ui",
  "crates/quark-components",
  "crates/quark-app",
  "crates/quark-update",
  # A member so CI's fmt, clippy, and tests cover the patch.
  "vendor/accesskit_unix",
]
# cargo-fuzz targets build on their own with nightly sanitizers.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/seatedro/quark"

[workspace.dependencies]
quark = { path = "crates/quark" }
quark-macros = { path = "crates/quark-macros" }
quark-render = { path = "crates/quark-render" }
# Without the bundled emoji and CJK fonts (about 14 MB); quark-app turns
# them on by default.
quark-text = { path = "crates/quark-text", default-features = false }
quark-syntax = { path = "crates/quark-syntax" }
quark-diff = { path = "crates/quark-diff" }
quark-i18n = { path = "crates/quark-i18n" }
quark-ui = { path = "crates/quark-ui" }
quark-components = { path = "crates/quark-components" }
quark-app = { path = "crates/quark-app" }
quark-update = { path = "crates/quark-update" }
accesskit = "0.24"
accesskit_winit = "0.33"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
# Must stay on the cosmic-text minor that glyphon re-exports so FontSystem is one type.
cosmic-text = "0.15"
bytemuck = { version = "1.25.0", features = ["derive"] }
glyphon = "0.10.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pollster = "0.4.0"
profiling = "1.0"
# Tests only. Drops fork/timeout/regex strategies to keep builds small.
proptest = { version = "1", default-features = false, features = ["std"] }
pulldown-cmark = { version = "0.13", default-features = false }
raw-window-handle = "0.6"
resvg = { version = "0.45", default-features = false }
serde = { version = "1.0", features = ["derive"] }
subsecond = "0.7"
taffy = "0.9.2"
thiserror = "2"
tracing = "0.1.44"
tungstenite = "0.29"
unicode-segmentation = "1.12"
# Native backends only: no WebGPU/WebGL. quark-render adds GLES on Linux as
# the fallback for machines without a Vulkan driver.
wgpu = { version = "28.0.0", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "metal", "dx12"] }
winit = "0.30"

[profile.dev]
opt-level = 1
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
# Drop DWARF but keep the symbol table: the panic hook logs a backtrace, and
# with `strip = true` every frame would print as <unknown>.
strip = "debuginfo"
# Keep the default panic = "unwind" so the panic hook can log before exit.
panic = "unwind"

# accesskit_unix 0.22.1 plus the AT-SPI methods cua-driver needs
# (GetRoleName, an `id` attribute). See vendor/accesskit_unix/VENDORED.md.
[patch.crates-io]
accesskit_unix = { path = "vendor/accesskit_unix" }
