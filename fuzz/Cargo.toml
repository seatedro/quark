[package]
name = "quark-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
quark-diff = { path = "../crates/quark-diff" }
quark-terminal = { path = "../crates/quark-terminal" }
quark-text = { path = "../crates/quark-text" }
quark-ui = { path = "../crates/quark-ui" }
unicode-segmentation = "1.12"
# quark-terminal's key and modifier types.
winit = "0.30"

# Its own workspace so the root workspace never builds it.
[workspace]
members = ["."]

# The root workspace's patches do not reach this one; quark's crates need them.
[patch.crates-io]
cosmic-text = { path = "../vendor/cosmic-text" }
taffy = { path = "../vendor/taffy" }

[[bin]]
name = "text_layout"
path = "fuzz_targets/text_layout.rs"
test = false
doc = false
bench = false

[[bin]]
name = "markdown"
path = "fuzz_targets/markdown.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unified_diff"
path = "fuzz_targets/unified_diff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "terminal_vt"
path = "fuzz_targets/terminal_vt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "terminal_input"
path = "fuzz_targets/terminal_input.rs"
test = false
doc = false
bench = false
