[package]
name = "quark-fmt"
description = "Formats quark view! templates in Rust source, changing only whitespace between tokens."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Byte ranges of tokens parsed outside a proc macro (`Span::byte_range`).
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
# `visit` finds every macro position in a parsed file.
syn = { version = "2", features = ["full", "visit"] }
# Comments, literal boundaries, and offsets of the original source. Template
# structure comes from the shared parser, never from this lexer. Pinned to
# the last release on unicode-xid: later ones assert that unicode-ident and
# unicode-properties share a Unicode version, which the lockfile's
# unicode-ident 1.0.26 and newest unicode-properties 0.1.4 do not.
ra-ap-rustc_lexer = "=0.145.0"
unicode-width = "0.2"

[dev-dependencies]
proptest.workspace = true
