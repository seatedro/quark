# Pinned grammar sources for quark-syntax packs.
#
# `rev` is a full git commit of `repo`. `sha256` covers every file the build
# reads: the C sources and headers under `src`, any `include` files, and the
# query files, as `<path>\0<sha256>\n` lines sorted by path (see
# `source_hash` in src/main.rs). A rewritten rev or a tampered mirror fails
# the build. After bumping `rev`, run the build once: it prints the new hash
# to paste here.
#
# Query paths are relative to the repository; `@<language>/<path>` reads
# from another entry's checkout, for grammars whose queries layer over
# another's. Several highlight files are concatenated in order.
#
# Defaults: `src = "src"`, `symbol = "tree_sitter_<language>"`.

[bash]
repo = "https://github.com/tree-sitter/tree-sitter-bash"
rev = "a06c2e4415e9bc0346c6b86d401879ffb44058f7"
version = "0.25.1"
aliases = ["sh", "shell", "zsh", "console"]
extensions = ["sh", "bash", "zsh"]
highlights = ["queries/highlights.scm"]
sha256 = "61f293830ad01f986c8675f9ac4d07f6462a2fbd23dd8a978b710d2e3b40da65"

[go]
repo = "https://github.com/tree-sitter/tree-sitter-go"
rev = "1547678a9da59885853f5f5cc8a99cc203fa2e2c"
version = "0.25.0"
aliases = ["golang"]
extensions = ["go"]
highlights = ["queries/highlights.scm"]
sha256 = "eb1fdb0fed6670a635197752ebb1befe8da21b8dfed8b31715f22eb4941ecc4b"

[javascript]
repo = "https://github.com/tree-sitter/tree-sitter-javascript"
rev = "44c892e0be055ac465d5eeddae6d3e194424e7de"
version = "0.25.0"
aliases = ["js", "jsx", "mjs", "cjs"]
extensions = ["js", "jsx", "mjs", "cjs"]
highlights = ["queries/highlights.scm", "queries/highlights-jsx.scm"]
injections = ["queries/injections.scm"]
sha256 = "00af6bfe573134e8080d11b0a5a4612765d23573616abfd56b48a989526ac63e"

[json]
repo = "https://github.com/tree-sitter/tree-sitter-json"
rev = "ee35a6ebefcef0c5c416c0d1ccec7370cfca5a24"
version = "0.24.8"
aliases = ["jsonc"]
extensions = ["json", "jsonc"]
highlights = ["queries/highlights.scm"]
sha256 = "f3f4d5af175536442c9aad54f4bb5a61ee1d85a407a0c9ded617b72ea65853ad"

[python]
repo = "https://github.com/tree-sitter/tree-sitter-python"
rev = "293fdc02038ee2bf0e2e206711b69c90ac0d413f"
version = "0.25.0"
aliases = ["py", "python3"]
extensions = ["py", "pyi"]
highlights = ["queries/highlights.scm"]
sha256 = "6cf4880802ad351ac72c6edd02c362c8b2d7e012c82948cdc5ce7cbfe1a53cb3"

[rust]
repo = "https://github.com/tree-sitter/tree-sitter-rust"
rev = "77a3747266f4d621d0757825e6b11edcbf991ca5"
version = "0.24.2"
aliases = ["rs"]
extensions = ["rs"]
highlights = ["queries/highlights.scm"]
injections = ["queries/injections.scm"]
sha256 = "9ca0e726a8d8befee951e16baa429f772fe4d24b11c34024f5c301cece11e720"

# TypeScript's query only covers what it adds to JavaScript; the grammar
# repository layers it over JavaScript's.
[typescript]
repo = "https://github.com/tree-sitter/tree-sitter-typescript"
rev = "f975a621f4e7f532fe322e13c4f79495e0a7b2e7"
version = "0.23.2"
src = "typescript/src"
include = ["common/scanner.h"]
aliases = ["ts", "mts", "cts"]
extensions = ["ts", "mts", "cts"]
highlights = ["@javascript/queries/highlights.scm", "queries/highlights.scm"]
sha256 = "4b557b121fed86ca65226e3359924e202d7f354702a00bc8454700f962370e34"
