[package]
name = "syntax-pack"
description = "Builds quark-syntax grammar packs from pinned sources and signs their index."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Finds the C compiler and linker for a target, MSVC included.
cc = "1.2"
# Pack types and checks, and loading each built pack as the app would.
quark-syntax = { workspace = true, features = ["download"] }
# Index signing, the same Ed25519 scheme and key format as update manifests.
quark-update.workspace = true
ring = "0.17"
serde.workspace = true
serde_json = "1.0"
toml = "1"
